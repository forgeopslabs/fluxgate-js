# Publishes @forgeops/fluxgate, @forgeops/fluxgate-react and
# @forgeops/fluxgate-angular to npm when a GitHub release is published.
# The release tag sets the version of all three: tag v1.2.3 publishes 1.2.3.
# A prerelease version such as 1.3.0-beta.1 is published under the "next" tag.
#
# Authentication: npm trusted publishing (OIDC). Each package lists this
# repository and workflow as its Trusted Publisher on npmjs.com, so no token is
# needed and every version gets provenance. Until that is configured, npm falls
# back to the NPM_TOKEN repository secret if it exists; delete the secret once
# trusted publishing works.

name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then echo "NPM_TAG=next" >> "$GITHUB_ENV"; else echo "NPM_TAG=latest" >> "$GITHUB_ENV"; fi
          for dir in packages/*/; do
            (cd "$dir" && npm pkg set version="$VERSION")
          done

      - run: pnpm build
      - run: pnpm test

      # pnpm pack turns workspace: ranges into real versions (and packs the
      # Angular package from its dist folder); npm publishes, because trusted
      # publishing needs npm 11.5.1 or later.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for dir in packages/core packages/react packages/angular; do
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packages")
          done

      - name: Install npm with trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Publish
        run: |
          for tarball in "$RUNNER_TEMP"/packages/*.tgz; do
            npm publish "$tarball" --access public --tag "$NPM_TAG" --provenance
          done
        env:
          # Fallback only; trusted publishing is used when configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
