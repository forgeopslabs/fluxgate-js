# Publishes @forgeopslabs/fluxgate, @forgeopslabs/fluxgate-react and
# @forgeopslabs/fluxgate-angular to npm when a GitHub release is published.
# The release tag sets the version of all three: tag v1.2.3 publishes 1.2.3.
# A prerelease version such as 1.3.0-beta.1 is published under the "next" tag.
#
# Required repository secret:
#   NPM_TOKEN - npm automation (or granular publish) token for the forgeopslabs org

name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then echo "NPM_TAG=next" >> "$GITHUB_ENV"; else echo "NPM_TAG=latest" >> "$GITHUB_ENV"; fi
          for dir in packages/*/; do
            (cd "$dir" && npm pkg set version="$VERSION")
          done

      - run: pnpm build
      - run: pnpm test

      - name: Publish
        run: pnpm --filter './packages/**' publish --access public --no-git-checks --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
