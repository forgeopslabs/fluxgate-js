# Publishes @forgeops/fluxgate, @forgeops/fluxgate-react and
# @forgeops/fluxgate-angular to npm when a GitHub release is published.
# The release tag sets the version of all three: tag v1.2.3 publishes 1.2.3.
# A prerelease version such as 1.3.0-beta.1 is published under the "next" tag.
#
# Authentication, with provenance either way:
# - With the NPM_TOKEN repository secret: Node's bundled npm 10 publishes with
#   that token and never tries OIDC.
# - Without it: npm 11.5.1+ uses trusted publishing (OIDC); each package lists
#   this repository and workflow as its Trusted Publisher on npmjs.com.
# npm cannot yet match the immutable OIDC subject GitHub gives repositories
# created after 2026-07-15, which includes this one (npm/cli#9969), so keep
# NPM_TOKEN until that is fixed, then delete it.

name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Set version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then echo "NPM_TAG=next" >> "$GITHUB_ENV"; else echo "NPM_TAG=latest" >> "$GITHUB_ENV"; fi
          for dir in packages/*/; do
            (cd "$dir" && npm pkg set version="$VERSION")
          done

      - run: pnpm build
      - run: pnpm test

      # pnpm pack turns workspace: ranges into real versions (and packs the
      # Angular package from its dist folder); npm publishes the tarballs.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for dir in packages/core packages/react packages/angular; do
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packages")
          done

      - name: Install npm with trusted publishing support
        if: env.NPM_TOKEN == ''
        run: npm install -g npm@^11.5.1

      - name: Publish
        run: |
          for tarball in "$RUNNER_TEMP"/packages/*.tgz; do
            name=$(tar -xOzf "$tarball" package/package.json | jq -r .name)
            # Lets a failed release be re-run after some packages were published.
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
              continue
            fi
            npm publish "$tarball" --access public --tag "$NPM_TAG" --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
